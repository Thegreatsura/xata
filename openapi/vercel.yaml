openapi: 3.0.0
info:
  title: Vercel Marketplace API
  version: '1.0'
  contact:
    name: support@xata.io
  description: |
    Inbound Vercel Native Marketplace Partner API implemented by Xata. These
    endpoints are called by Vercel and authenticated via a signed OIDC JWT
    (verified against Vercel's JWKS), not the normal Xata API authentication.
paths:
  '/v1/installations/{installationId}':
    put:
      operationId: upsertInstallation
      summary: Upsert a Vercel Marketplace installation
      description: |
        Create or update an installation. Vercel sends this when a customer
        installs (or re-sends it idempotently). The acting account is taken from
        the signed token claims, not this body. There is one installation per
        Vercel team, and an installation can own many Xata organizations.
      parameters:
        - $ref: '#/components/parameters/InstallationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertInstallationRequest'
      responses:
        '204':
          description: |
            Installation created or updated. No body. (Vercel's contract also
            allows a 200 with an installation-level billingPlan/notification
            body; Xata does not use installation-level billing plans.)
        '400':
          $ref: '#/components/responses/VercelError'
        '403':
          $ref: '#/components/responses/VercelError'
        '409':
          $ref: '#/components/responses/VercelError'
      tags:
        - Vercel
      x-excluded: true
      x-operation-kind: write
    delete:
      operationId: deleteInstallation
      summary: Delete a Vercel Marketplace installation
      description: |
        Begin uninstalling an installation. The installation is marked
        'deleting' so billing can finalize before being soft-deleted; the 204
        defers final deletion to Vercel's 24-hour window. (Vercel's contract
        also allows a 200 with {"finalized": true} for immediate deletion;
        Xata always finalizes asynchronously.)
      parameters:
        - $ref: '#/components/parameters/InstallationId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteInstallationRequest'
      responses:
        '204':
          description: Uninstall accepted; deletion finalizes asynchronously. No body.
        '403':
          $ref: '#/components/responses/VercelError'
        '409':
          $ref: '#/components/responses/VercelError'
      tags:
        - Vercel
      x-excluded: true
      x-operation-kind: destructive
  '/v1/products/{productSlug}/plans':
    get:
      operationId: listBillingPlansForProduct
      summary: List billing plans for a product
      description: |
        Return the product's available billing plans, rendered into Vercel's
        billingPlan shape. Vercel calls this to show plans when a customer creates
        a resource; it may be called before any installation exists, so the signed
        token can carry no installation or account id. Plans are billing SKUs only
        and do not change Xata entitlements (every Vercel org is T2).
      parameters:
        - $ref: '#/components/parameters/ProductSlug'
        - name: metadata
          in: query
          description: Opaque metadata forwarded by Vercel.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: The product's billing plans.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListBillingPlansResponse'
        '400':
          $ref: '#/components/responses/VercelError'
        '403':
          $ref: '#/components/responses/VercelError'
        '404':
          $ref: '#/components/responses/VercelError'
      tags:
        - Vercel
      x-excluded: true
      x-operation-kind: read
  '/v1/installations/{installationId}/resources/{resourceId}':
    get:
      operationId: getResource
      summary: Get a Vercel Marketplace resource
      description: |
        Return a provisioned resource. Scoped to the installation in the signed
        token; a resource owned by another installation is reported as not found.
      parameters:
        - $ref: '#/components/parameters/InstallationId'
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: The resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        '403':
          $ref: '#/components/responses/ResourceError'
        '404':
          $ref: '#/components/responses/ResourceError'
        '500':
          $ref: '#/components/responses/ResourceError'
      tags:
        - Vercel Resources
      x-excluded: true
      x-operation-kind: read
    delete:
      operationId: deleteResource
      summary: Delete a Vercel Marketplace resource
      description: |
        Deprovision a resource (its Xata project and branches) and mark the
        tracking records deleting. Vercel calls this when a customer removes a
        resource. Idempotent: a resource already being torn down is deprovisioned
        again harmlessly; a resource that no longer exists returns 404.
      parameters:
        - $ref: '#/components/parameters/InstallationId'
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '204':
          description: The resource is being deprovisioned.
        '403':
          $ref: '#/components/responses/ResourceError'
        '404':
          $ref: '#/components/responses/ResourceError'
        '429':
          $ref: '#/components/responses/ResourceError'
        '500':
          $ref: '#/components/responses/ResourceError'
      tags:
        - Vercel Resources
      x-excluded: true
      x-operation-kind: destructive
  '/v1/installations/{installationId}/resources':
    post:
      operationId: provisionResource
      summary: Provision a Vercel Marketplace resource
      description: |
        Create a resource (a Xata project and its branches) and return it with
        the connection secrets. Vercel calls this when a customer creates a
        resource. Idempotent when an Idempotency-Key header is sent: a retry with
        the same key returns the existing resource unchanged, and reusing the key
        with a different body is a conflict (409). Without the header there is no
        stable key, so each call provisions a new resource.
      parameters:
        - $ref: '#/components/parameters/InstallationId'
        - name: Idempotency-Key
          in: header
          description: |
            A stable key Vercel sends to make retries safe. A repeat with the same
            key returns the existing resource; reusing it with a different body is a
            conflict (409). Optional — without it each call provisions a new resource.
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProvisionResourceRequest'
      responses:
        '200':
          description: 'The provisioned resource, with connection secrets.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvisionedResource'
        '400':
          $ref: '#/components/responses/ResourceError'
        '403':
          $ref: '#/components/responses/ResourceError'
        '404':
          $ref: '#/components/responses/ResourceError'
        '409':
          $ref: '#/components/responses/ResourceError'
        '429':
          $ref: '#/components/responses/ResourceError'
        '500':
          $ref: '#/components/responses/ResourceError'
        '503':
          $ref: '#/components/responses/ResourceError'
      tags:
        - Vercel Resources
      x-excluded: true
      x-operation-kind: write
components:
  parameters:
    InstallationId:
      name: installationId
      in: path
      required: true
      description: Vercel installation id (icfg_...).
      schema:
        type: string
    ProductSlug:
      name: productSlug
      in: path
      required: true
      description: Vercel product slug (e.g. xata-postgres).
      schema:
        type: string
    ResourceId:
      name: resourceId
      in: path
      required: true
      description: Vercel resource id.
      schema:
        type: string
  schemas:
    UpsertInstallationRequest:
      type: object
      properties:
        scopes:
          description: Scopes granted to the installation.
          type: array
          items:
            type: string
        acceptedPolicies:
          description: 'Map of policy id to the acceptance timestamp (RFC 3339), e.g. {"toc": "2024-02-28T10:00:00Z"}.'
          type: object
          additionalProperties:
            type: string
            format: date-time
        credentials:
          $ref: '#/components/schemas/InstallationCredentials'
        account:
          $ref: '#/components/schemas/InstallationAccount'
      required:
        - scopes
        - acceptedPolicies
        - credentials
        - account
      x-excluded: true
      x-internal: true
    InstallationCredentials:
      type: object
      properties:
        access_token:
          description: Installation access token that authenticates our outbound Partner API calls to Vercel. Stored encrypted at rest.
          type: string
        token_type:
          description: Token type (e.g. "Bearer").
          type: string
      required:
        - access_token
        - token_type
      x-excluded: true
      x-internal: true
    InstallationAccount:
      description: The Vercel account/team installing the integration.
      type: object
      properties:
        name:
          description: Team name (absent for personal accounts).
          type: string
        url:
          description: URL of the account on Vercel.
          type: string
        contact:
          description: Contact details for the account.
          type: object
          properties:
            email:
              type: string
            name:
              type: string
          required:
            - email
      required:
        - url
      x-excluded: true
      x-internal: true
    DeleteInstallationRequest:
      type: object
      properties:
        cascadeResourceDeletion:
          description: Whether to delete the installation's resources along with the installation.
          type: boolean
        reason:
          description: The reason for deleting the installation.
          type: string
      x-excluded: true
      x-internal: true
    ListBillingPlansResponse:
      description: The billing plans available for a product.
      type: object
      properties:
        plans:
          type: array
          items:
            $ref: '#/components/schemas/BillingPlan'
      required:
        - plans
      x-excluded: true
      x-internal: true
    BillingPlan:
      description: A Vercel Marketplace billing plan. Billing SKU only; it does not change Xata entitlements.
      type: object
      properties:
        id:
          description: Partner-provided billing plan id.
          type: string
        type:
          description: 'Plan type: "subscription" or "prepayment".'
          type: string
        name:
          type: string
        description:
          type: string
        scope:
          description: Plan scope; installation-level plans require enablement on the integration.
          type: string
        paymentMethodRequired:
          description: Subscription plans only. false means the plan is completely free.
          type: boolean
        preauthorizationAmount:
          description: Subscription + paymentMethodRequired. Amount used to test the payment method; never charged.
          type: number
        initialCharge:
          description: Subscription + paymentMethodRequired. Amount invoiced immediately at sign-up (decimal USD string).
          type: string
        cost:
          description: 'Display cost for fixed-cost plans, e.g. "$20.00/month". Omitted for usage-based plans.'
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/PlanDetail'
        highlightedDetails:
          type: array
          items:
            $ref: '#/components/schemas/PlanDetail'
        quote:
          type: array
          items:
            $ref: '#/components/schemas/PlanQuoteLine'
        effectiveDate:
          type: string
        disabled:
          type: boolean
      required:
        - id
        - type
        - name
        - description
      x-excluded: true
      x-internal: true
    PlanDetail:
      type: object
      properties:
        label:
          type: string
        value:
          type: string
      required:
        - label
      x-excluded: true
      x-internal: true
    PlanQuoteLine:
      type: object
      properties:
        line:
          type: string
        amount:
          type: string
      required:
        - line
        - amount
      x-excluded: true
      x-internal: true
    VercelError:
      description: Vercel Partner API error envelope.
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              description: 'Machine-readable error code (e.g. validation_error, conflict).'
              type: string
            message:
              description: Human-readable (system) error message.
              type: string
            user:
              description: 'User-facing error details, if applicable.'
              type: object
              properties:
                message:
                  description: User-facing error message.
                  type: string
                url:
                  description: URL to a help article or dashboard page for resolution.
                  type: string
            fields:
              description: 'Offending fields, for validation errors.'
              type: array
              items:
                type: object
                properties:
                  key:
                    type: string
                  message:
                    type: string
                required:
                  - key
          required:
            - code
            - message
      required:
        - error
      x-excluded: true
      x-internal: true
    Resource:
      description: |
        A provisioned Vercel Marketplace resource. Matches Vercel's Partner API
        "Get Resource" response. Secrets/connection info are returned by Provision
        Resource, not here.
      type: object
      properties:
        id:
          description: The partner-specific resource id.
          type: string
        productId:
          description: The partner-specific product id/slug.
          type: string
        name:
          description: User-inputted resource name.
          type: string
        metadata:
          description: User-inputted metadata based on the registered metadata schema.
          type: object
          additionalProperties: true
        status:
          description: 'Resource lifecycle status. One of Vercel''s values: ready, pending, onboarding, suspended, resumed, uninstalled, error.'
          type: string
      required:
        - id
        - productId
        - name
        - metadata
        - status
      x-excluded: true
      x-internal: true
    ProvisionResourceRequest:
      description: Vercel Provision Resource request body.
      type: object
      properties:
        productId:
          description: The partner-specific product id/slug.
          type: string
        name:
          description: User-inputted resource name.
          type: string
        metadata:
          description: User-inputted metadata based on the registered metadata schema.
          type: object
          additionalProperties: true
        billingPlanId:
          description: Selected Vercel billing plan id.
          type: string
        externalId:
          description: Partner-provided identifier indicating the source of provisioning.
          type: string
      required:
        - productId
        - name
        - metadata
        - billingPlanId
      x-excluded: true
      x-internal: true
    ProvisionedResource:
      description: |
        A newly provisioned resource: the Resource fields plus the connection
        secrets. Provision Resource is the only endpoint that returns secrets.
      type: object
      properties:
        id:
          description: The partner-specific resource id.
          type: string
        productId:
          description: The partner-specific product id/slug.
          type: string
        name:
          description: User-inputted resource name.
          type: string
        metadata:
          description: User-inputted metadata based on the registered metadata schema.
          type: object
          additionalProperties: true
        status:
          description: 'Resource lifecycle status. One of Vercel''s values: ready, pending, onboarding, suspended, resumed, uninstalled, error.'
          type: string
        secrets:
          description: Connection secrets that become environment variables on connected projects.
          type: array
          items:
            $ref: '#/components/schemas/Secret'
      required:
        - id
        - productId
        - name
        - metadata
        - status
        - secrets
      x-excluded: true
      x-internal: true
    Secret:
      description: A connection secret exposed as an environment variable on connected Vercel projects.
      type: object
      properties:
        name:
          description: Environment variable name.
          type: string
        value:
          description: 'Default value, used when no per-environment override applies.'
          type: string
        environmentOverrides:
          description: Per-environment values that override value for that Vercel environment.
          type: object
          properties:
            development:
              type: string
            preview:
              type: string
            production:
              type: string
      required:
        - name
        - value
      x-excluded: true
      x-internal: true
    ResourceError:
      description: Vercel Partner API error envelope.
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              description: 'Machine-readable error code (e.g. validation_error, conflict).'
              type: string
            message:
              description: Human-readable (system) error message.
              type: string
            user:
              description: 'User-facing error details, if applicable.'
              type: object
              properties:
                message:
                  description: User-facing error message.
                  type: string
                url:
                  description: URL to a help article or dashboard page for resolution.
                  type: string
            fields:
              description: 'Field-level validation errors, for 400 responses.'
              type: array
              items:
                type: object
                properties:
                  key:
                    description: The metadata field the error applies to.
                    type: string
                  message:
                    description: Validation message for this field.
                    type: string
                required:
                  - key
          required:
            - code
            - message
      required:
        - error
      x-excluded: true
      x-internal: true
  responses:
    VercelError:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VercelError'
    ResourceError:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResourceError'
