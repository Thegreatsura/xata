# RustFS, an S3-compatible object store, standing in for S3 in local
# development: pgBackRest and barman back branches up to the `backups` bucket
# and the billing collector writes events to `billing-events-local`. Loaded by
# both Tiltfiles. Data lives on an emptyDir and is lost with the pod.
apiVersion: v1
kind: Secret
metadata:
  name: rustfs-eu
  namespace: xata-clusters
type: Opaque
stringData:
  accessKey: rustfsuser
  secretKey: rustfspass
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs-eu
  namespace: xata-clusters
spec:
  selector:
    app: rustfs-eu
  ports:
    - name: s3
      port: 9000
      targetPort: s3
    - name: console
      port: 9001
      targetPort: console
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs-eu
  namespace: xata-clusters
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rustfs-eu
  template:
    metadata:
      labels:
        app: rustfs-eu
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: rustfs
          image: rustfs/rustfs:1.0.0
          env:
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-eu
                  key: accessKey
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-eu
                  key: secretKey
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health/ready
              port: s3
            periodSeconds: 5
        # A sidecar rather than a Job, so the buckets come back whenever the pod,
        # and with it the emptyDir, is replaced.
        - name: buckets
          image: rustfs/rustfs:1.0.0
          command:
            - /bin/sh
            - -ec
            - |
              s3() { curl -fs --aws-sigv4 aws:amz:us-east-1:s3 --user "$ACCESS_KEY:$SECRET_KEY" "$@"; }
              until s3 -o /dev/null http://127.0.0.1:9000/; do sleep 2; done
              for bucket in backups billing-events-local; do
                s3 -o /dev/null --head "http://127.0.0.1:9000/$bucket" || s3 -S -X PUT "http://127.0.0.1:9000/$bucket"
              done
              touch /tmp/ready
              exec sleep infinity
          env:
            - name: ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-eu
                  key: accessKey
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-eu
                  key: secretKey
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          readinessProbe:
            exec:
              command: [test, -f, /tmp/ready]
            periodSeconds: 2
      volumes:
        - name: data
          emptyDir: {}
