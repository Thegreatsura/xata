{{- if .Values.rustfs.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.rustfs.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.rustfs.name }}
spec:
  selector:
    app: {{ .Values.rustfs.name }}
  ports:
    - name: s3
      protocol: TCP
      port: 9000
      targetPort: s3
  type: ClusterIP
{{- end }}
