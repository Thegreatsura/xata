{{- if .Values.mailpit.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  namespace: {{ .Release.Namespace }}
  labels:
    app: mailpit
    component: email
spec:
  selector:
    app: mailpit
  ports:
    - name: smtp
      protocol: TCP
      port: 1025
      targetPort: smtp
    - name: http
      protocol: TCP
      port: 8025
      targetPort: http
  type: ClusterIP
  sessionAffinity: ClientIP
{{- if .Values.mailpit.service.uiNodePort }}
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit-ui
  namespace: {{ .Release.Namespace }}
  labels:
    app: mailpit
    component: email
spec:
  selector:
    app: mailpit
  ports:
    - name: http
      protocol: TCP
      port: 8025
      targetPort: http
      nodePort: {{ .Values.mailpit.service.uiNodePort }}
  type: NodePort
  sessionAffinity: ClientIP
{{- end }}
{{- end }}
