postgres:
  enabled: true

  image:
    repository: postgres
    tag: "17"

  storage:
    size: 1Gi

  resources: {}

  # Credentials for the read-only role the projects bootstrap Job creates. Off by
  # default: the local overlays already get this Secret from the Tiltfile.
  metastoreReader:
    create: false
    password: changeme

  # Serve a self-signed certificate generated at first start, so clients can
  # connect with sslmode=require.
  tls:
    enabled: true

mailpit:
  enabled: true

  image:
    repository: axllent/mailpit
    tag: v1.31.1

  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 256Mi

  service:
    # Set to expose the web UI on a node port through an extra Service.
    uiNodePort: null

rustfs:
  enabled: false

  # Names the StatefulSet, the Service and the credentials Secret.
  # branch-operator and the cell overlays default to this name.
  name: rustfs-eu

  image:
    repository: rustfs/rustfs
    tag: 1.0.0

  storage:
    size: 20Gi

  # Parallel backup uploads take it to about 300 MiB, which it keeps.
  resources:
    requests:
      cpu: 50m
      memory: 512Mi
    limits:
      memory: 512Mi

  # Buckets created on every start by a sidecar, existing ones left alone.
  buckets: []

# Arm64 nodes carry a kubernetes.io/arch=arm64:NoSchedule taint, as in the other charts here.
tolerations:
  - key: "kubernetes.io/arch"
    operator: "Equal"
    value: "arm64"
    effect: "NoSchedule"
