# hidden hides a whole major version by default; its minors remain available
# behind the per-major feature flag (pgMajor<major>).
#
# The two are independent and compose: an image of a major that is both hidden
# and show_only_latest needs pgMajor<major>, and additionally legacyPgVersions
# if it is not the latest minor.
#
