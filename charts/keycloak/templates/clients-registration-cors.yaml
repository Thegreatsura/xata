# Keycloak sets no CORS headers on its anonymous client-registration endpoint,
# so browser-based MCP clients can't complete Dynamic Client Registration.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak-eg-clients-registration
  namespace: {{ .Release.Namespace }}
  labels:
    xata.tech/gateway: auth
spec:
  parentRefs:
    - name: keycloak-eg
  hostnames:
    - localhost
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: auth-keycloak-service
          port: 8080
      matches:
        - path:
            type: PathPrefix
            value: /realms/{{ .Values.config.api.realm }}/clients-registrations
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: keycloak-clients-registration-cors
  namespace: {{ .Release.Namespace }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: keycloak-eg-clients-registration
  cors:
    allowOrigins:
      - "*"
    allowMethods:
      - POST
    allowHeaders:
      - Content-Type
