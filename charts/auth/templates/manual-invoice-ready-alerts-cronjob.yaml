---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Chart.Name }}-manual-invoice-ready-alerts
  namespace: {{ .Release.Namespace }}
spec:
  suspend: {{ .Values.manualInvoiceReadyAlerts.suspend }}
  schedule: {{ .Values.manualInvoiceReadyAlerts.schedule | quote }}
  timeZone: {{ .Values.manualInvoiceReadyAlerts.timeZone | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          enableServiceLinks: false
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: manual-invoice-ready-alerts
              image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["/server"]
              args:
                - manual_invoice_ready_alerts
              env:
                - name: ORB_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: orb-secret
                      key: api-key
                - name: SLACK_BOT_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: slack-secret
                      key: bot-token
              envFrom:
                - configMapRef:
                    name: slack-config
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                {{- toYaml .Values.manualInvoiceReadyAlerts.resources | nindent 16 }}
