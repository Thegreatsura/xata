---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Chart.Name }}-sso-domain-recheck
  namespace: {{ .Release.Namespace }}
  annotations:
    description: "ServiceAccount for SSO Domain Recheck Job"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Chart.Name }}-sso-domain-recheck
  namespace: {{ .Release.Namespace }}
spec:
  suspend: {{ .Values.ssoDomainRecheck.suspend }}
  schedule: {{ .Values.ssoDomainRecheck.schedule | quote }}
  timeZone: {{ .Values.ssoDomainRecheck.timeZone | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          serviceAccountName: {{ .Chart.Name }}-sso-domain-recheck
          restartPolicy: Never
          enableServiceLinks: false
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: sso-domain-recheck
              image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["/server"]
              args:
                - sso_domain_recheck
              env:
                - name: FRONTEND_URL
                  value: {{ .Values.config.frontendURL | quote }}
                - name: AUTH_HMAC_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: auth-hmac
                      key: hmac-secret
                - name: KEYCLOAK_ADMIN_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: auth-keycloak-initial-admin
                      key: username
                - name: KEYCLOAK_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: auth-keycloak-initial-admin
                      key: password
                - name: CUSTOMER_IO_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: customerio
                      key: CUSTOMER_IO_API_KEY
                      optional: true
                - name: CUSTOMER_IO_IS_PRODUCTION
                  valueFrom:
                    configMapKeyRef:
                      name: customerio-config
                      key: CUSTOMER_IO_IS_PRODUCTION
                      optional: true
              envFrom:
                - configMapRef:
                    name: keycloak-api-settings
                - secretRef:
                    name: posthog
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                {{- toYaml .Values.ssoDomainRecheck.resources | nindent 16 }}
