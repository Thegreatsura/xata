apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    xata.tech/gateway: api
spec:
  parentRefs:
    - name: {{ .Values.httpRoute.parentRef.name }}
      {{- if .Values.httpRoute.parentRef.namespace }}
      namespace: {{ .Values.httpRoute.parentRef.namespace }}
      {{- end }}
  hostnames:
    - {{ .Values.httpRoute.hostname }}
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: {{ .Chart.Name }}
          port: {{ .Values.service.httpPort }}
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /_hello
        - path:
            type: PathPrefix
            value: /openapi.yaml
        - path:
            type: PathPrefix
            value: /openapi.json
        - path:
            type: PathPrefix
            value: /user
        - path:
            type: PathPrefix
            value: /api-keys
        - path:
            type: RegularExpression
            value: "^/webhooks/(orb|stripe)(/.*)?$"
        - path:
            type: PathPrefix
            value: /marketplace
        - path:
            type: RegularExpression
            value: "^/organizations(/*)$|^/organizations/([^/]+)(/api-keys|/members.*|/invitations.*|/deletion-request|/membership-limits|/billing/(checkout-session|payment-method-session|customer|invoices(/upcoming)?))?$"
      timeouts:
        request: 60s
