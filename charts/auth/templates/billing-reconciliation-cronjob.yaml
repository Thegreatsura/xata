---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Chart.Name }}-billing-reconciliation
  namespace: {{ .Release.Namespace }}
spec:
  suspend: {{ .Values.billingReconciliation.suspend }}
  schedule: {{ .Values.billingReconciliation.schedule | quote }}
  timeZone: {{ .Values.billingReconciliation.timeZone | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          enableServiceLinks: false
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: billing-reconciliation
              image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["/server"]
              args:
                - reconcile_org_billing_status
                - --issued-invoices
                {{- if .Values.billingReconciliation.dryRun }}
                - --dry-run
                {{- end }}
              env:
                - name: PROJECTS_GRPC_URL
                  value: {{ .Values.dependencies.projectsGrpcUrl | quote }}
                - name: ORB_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: orb-secret
                      key: api-key
                - name: STRIPE_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: stripe-secret
                      key: api-key
                - name: SLACK_BOT_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: slack-secret
                      key: bot-token
                - name: KEYCLOAK_ADMIN_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: auth-keycloak-initial-admin
                      key: username
                - name: KEYCLOAK_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: auth-keycloak-initial-admin
                      key: password
                - name: OTEL_SERVICE_NAME
                  value: "{{ .Values.observability.serviceName }}-billing-reconciliation"
              envFrom:
                - configMapRef:
                    name: keycloak-api-settings
                - configMapRef:
                    name: otel-config
                - configMapRef:
                    name: slack-config
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                {{- toYaml .Values.billingReconciliation.resources | nindent 16 }}
