image:
  repository: ghcr.io/xataio/xata/auth
  digest: ""
  tag: latest
  pullPolicy: IfNotPresent

service:
  httpPort: 5001
  grpcPort: 5002

dependencies:
  authGrpcUrl: "auth:5002"
  projectsGrpcUrl: "projects:5002"

postgres:
  sslmode: disable

observability:
  serviceName: auth

config:
  frontendURL: ""
  billingRequired: false

httpRoute:
  hostname: localhost
  parentRef:
    name: eg
    namespace: ""
  matches:
    - path: /_hello
      type: PathPrefix
    - path: /openapi.yaml
      type: PathPrefix
    - path: /openapi.json
      type: PathPrefix
    - path: /user
      type: PathPrefix
    - path: /api-keys
      type: PathPrefix
    - path: "^/webhooks/(orb|stripe)(/.*)?$"
      type: RegularExpression
    - path: /marketplace
      type: PathPrefix
    - path: "^/organizations(/*)$|^/organizations/([^/]+)(/api-keys|/members.*|/groups.*|/invitations.*|/deletion-request|/membership-limits|/sso(/domains(/[^/]+(/verify)?)?|/providers(/[^/]+(/enforcement)?)?)?|/billing/(checkout-session|payment-method-session|customer|invoices(/upcoming)?))?$"
      type: RegularExpression

resources:
  limits:
    cpu: 200m
    memory: 200Mi
  requests:
    cpu: 100m
    memory: 200Mi

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - auth
          topologyKey: kubernetes.io/hostname

tolerations:
  - key: "kubernetes.io/arch"
    operator: "Equal"
    value: "arm64"
    effect: "NoSchedule"

resourceCleanup:
  schedule: "0 10 * * *"
  disabledForDays: 15
  maxBranches: 50
  dryRun: true
  suspend: false
  resources:
    limits:
      cpu: 100m
      memory: 64Mi
    requests:
      cpu: 50m
      memory: 64Mi

# Periodic sweep of stale MCP clients (dynamically-registered Keycloak clients
# with no sessions). Suspended and dry-run by default; unsuspend per env and
# review the dry-run logs before turning dryRun off. See cleanup_mcp_clients.
#
# minAge spares clients registered within the window: a client that registered but
# has not completed the authorization code flow yet has no sessions and is otherwise
# indistinguishable from a stale one. The age comes from Keycloak CLIENT_REGISTER
# events, so minAge must stay below the realm's eventsExpiration (14d) - the job
# refuses to run otherwise.
mcpClientCleanup:
  schedule: "0 4 * * *"
  minAge: "168h"
  dryRun: true
  suspend: true
  resources:
    limits:
      cpu: 100m
      memory: 64Mi
    requests:
      cpu: 50m
      memory: 64Mi

manualInvoiceReadyAlerts:
  schedule: "0 9 * * *"
  timeZone: "Europe/Berlin"
  suspend: true
  resources:
    limits:
      cpu: 100m
      memory: 64Mi
    requests:
      cpu: 50m
      memory: 64Mi

trialExpiryEmails:
  schedule: "0 9 * * *"
  timeZone: "Etc/UTC"
  suspend: false
  resources:
    limits:
      cpu: 100m
      memory: 64Mi
    requests:
      cpu: 50m
      memory: 64Mi
