image:
  repository: ghcr.io/xataio/xata/auth
  digest: ""
  tag: latest
  pullPolicy: IfNotPresent

service:
  httpPort: 5001
  grpcPort: 5002

dependencies:
  authGrpcUrl: "auth:5002"
  projectsGrpcUrl: "projects:5002"

postgres:
  sslmode: disable

observability:
  serviceName: auth

config:
  frontendURL: ""
  billingRequired: false
  # Create the invitee's Keycloak account before sending an organization
  # invitation, so the invite can be accepted by identity-provider users.
  # Temporary, until we run a Keycloak carrying keycloak/keycloak#52181.
  seedInvitedUsers: false

httpRoute:
  hostname: localhost
  parentRef:
    name: eg
    namespace: ""
  matches:
    - path: /_hello
      type: PathPrefix
    - path: /openapi.yaml
      type: PathPrefix
    - path: /openapi.json
      type: PathPrefix
    - path: /user
      type: PathPrefix
    - path: /api-keys
      type: PathPrefix
    - path: "^/webhooks/(orb|stripe)(/.*)?$"
      type: RegularExpression
    - path: /marketplace
      type: PathPrefix
    - path: "^/organizations(/*)$|^/organizations/([^/]+)(/api-keys|/members.*|/invitations.*|/deletion-request|/membership-limits|/billing/(checkout-session|payment-method-session|customer|invoices(/upcoming)?))?$"
      type: RegularExpression

resources:
  limits:
    cpu: 200m
    memory: 200Mi
  requests:
    cpu: 100m
    memory: 200Mi

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - auth
          topologyKey: kubernetes.io/hostname

tolerations:
  - key: "kubernetes.io/arch"
    operator: "Equal"
    value: "arm64"
    effect: "NoSchedule"

resourceCleanup:
  schedule: "0 10 * * *"
  disabledForDays: 15
  maxBranches: 50
  dryRun: true
  suspend: false
  resources:
    limits:
      cpu: 100m
      memory: 64Mi
    requests:
      cpu: 50m
      memory: 64Mi

# Periodic sweep of stale MCP clients (dynamically-registered Keycloak clients
# carrying requiredScope). Suspended and dry-run by default; unsuspend per env
# and review the dry-run logs before turning dryRun off. See cleanup_mcp_clients.
mcpClientCleanup:
  schedule: "0 4 * * *"
  requiredScope: "mcp-client"
  dryRun: true
  suspend: true
  resources:
    limits:
      cpu: 100m
      memory: 64Mi
    requests:
      cpu: 50m
      memory: 64Mi

trialExpiryEmails:
  schedule: "0 9 * * *"
  timeZone: "Etc/UTC"
  suspend: false
  resources:
    limits:
      cpu: 100m
      memory: 64Mi
    requests:
      cpu: 50m
      memory: 64Mi
