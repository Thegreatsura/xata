image:
  repository: ghcr.io/xataio/xata/clusters
  digest: ""
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

service:
  grpcPort: 5002
  type: ClusterIP
  nodePort: ""
  loadBalancerClass: ""
  annotations: {}

# Authentication of incoming gRPC calls (projects and gateway -> clusters).
grpc:
  auth:
    # off: accept every call. log: verify tokens, log failures, allow all.
    # enforce: reject calls without a valid token.
    # Quoted because a bare off is YAML for false.
    mode: "off"
    audience: clusters
    # PEM bundle of the Ed25519 public keys or X.509 certificates of every
    # allowed caller. Public material, so it can live in values.
    trustedKeys: ""
    # Secret holding the PEM bundle instead, e.g. a cert-manager Certificate
    # secret and its ca.crt or tls.crt. Takes precedence over trustedKeys.
    trustedKeysSecret:
      name: ""
      key: ca.crt

config:
  clusters:
    clustersNamespace: xata-clusters
    storageClass: ""
    nodeSelector: ""
    volumeSnapshotClass: ""
    cloudProvider: aws
    xatastor: { enabled: false }
    useStorageQoSClasses: false
    pgbackrest:
      encryptionEnabled: false
  observability:
    victoriaMetricsURL: "http://victoria-metrics.xata-observability.svc.cluster.local:8428"
    victoriaLogsURL: "http://victoria-logs.xata-observability.svc.cluster.local:9428"

resources:
  limits:
    memory: 200Mi
  requests:
    cpu: 100m
    memory: 200Mi

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - clusters
          topologyKey: kubernetes.io/hostname

tolerations:
  - key: "kubernetes.io/arch"
    operator: "Equal"
    value: "arm64"
    effect: "NoSchedule"
