image:
  repository: ghcr.io/xataio/xata/gateway
  digest: ""
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer
  port: 5432
  targetPort: 7654
  httpPort: 443
  httpTargetPort: 8443
  nodePort: ""
  httpNodePort: ""
  # These ports always take the client address from a PROXY protocol header,
  # and reject a connection without one. Point only a load balancer that always
  # adds the header at them.
  proxyTargetPort: 7655
  httpProxyTargetPort: 8444
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: external
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: instance
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
    service.beta.kubernetes.io/aws-load-balancer-proxy-protocol: "*"

http:
  enabled: true

# Take the client address from a PROXY protocol header on targetPort and
# httpTargetPort. Set false when the load balancer adds no header, or any
# client can set its own address.
trustProxyHeader: true

clustersNamespace: xata-clusters

# After SIGTERM the gateway stops accepting connections and waits this long for
# the existing ones to finish, then closes whatever is left.
drainingTime: 3500s

# Must exceed drainingTime, so the gateway has time to close the remaining
# connections before kubelet sends SIGKILL.
terminationGracePeriodSeconds: 3600

resources:
  limits:
    cpu: 8000m
  requests:
    cpu: 4000m
    memory: 512Mi

secret:
  name: gateway-secret
  mountPath: /pki

extraEnv: []

imagePullSecrets: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - gateway
          topologyKey: kubernetes.io/hostname

tolerations:
  - effect: NoSchedule
    key: kubernetes.io/arch
    operator: Equal
    value: arm64
