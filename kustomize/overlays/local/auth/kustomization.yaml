apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: xata

helmCharts:
  - name: auth
    releaseName: auth
    namespace: xata
    valuesFile: values.yaml
  - name: keycloak
    releaseName: keycloak
    namespace: xata
    valuesFile: keycloak-values.yaml
    includeCRDs: true

helmGlobals:
  chartHome: ../../../../charts

resources:
  - keycloak
  - api-key-hmac-secret.yaml
  - orb-secret.yaml
  - posthog-secret.yaml
  - stripe-secret.yaml
  - slack-secret.yaml
  - slack-config.yaml
  - tackle-secret.yaml

# Use keycloak's own EnvoyProxy so its Envoy Service name does not collide with
# the envoy-api name that overlays/local/api-gateway pins on the shared one.
patches:
  - target:
      group: gateway.networking.k8s.io
      version: v1
      kind: Gateway
      name: keycloak-eg
    patch: |
      - op: replace
        path: /spec/infrastructure/parametersRef/name
        value: keycloak-eg-custom-proxy-config
