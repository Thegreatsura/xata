name: Build and Push Docker Image

on:
  workflow_call:
    inputs:
      target:
        description: "Docker Bake target to build and push"
        required: true
        type: string
      git_ref:
        description: "Git ref to build"
        required: true
        type: string
      latest:
        description: "Tag the image as latest"
        required: false
        default: false
        type: boolean
      destinations:
        description: "Comma-separated list of registry paths to publish the image to"
        required: false
        default: "ghcr.io/xataio/xata"
        type: string
    outputs:
      image:
        description: "Docker image repository"
        value: ${{ jobs.docker.outputs.image }}
      digest:
        description: "Docker image manifest digest"
        value: ${{ jobs.docker.outputs.digest }}

permissions:
  contents: read
  packages: write

defaults:
  run:
    shell: bash

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image: ${{ steps.build-image.outputs.image }}
      digest: ${{ steps.build-image.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build-image
        env:
          TARGET: ${{ inputs.target }}
          DESTINATIONS: ${{ inputs.destinations }}
          TAG_AS_LATEST: ${{ inputs.latest }}
        run: make push-image OUTPUT_FILE="$GITHUB_OUTPUT"
