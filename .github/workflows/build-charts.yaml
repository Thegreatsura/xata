name: Build and Push Helm Charts

on:
  workflow_call:
    inputs:
      image_specs:
        description: "Newline-separated IMAGE=xxx DIGEST=sha256:yyy pairs"
        required: true
        type: string
      ref:
        description: "Git ref to checkout"
        required: false
        type: string
        default: ""

env:
  CHART_REGISTRY: oci://ghcr.io/xataio/xata/charts
  CHARTS: "auth clusters gateway projects branch-operator keycloak"

jobs:
  push-charts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Inject image digests into charts
        env:
          IMAGE_SPECS: ${{ inputs.image_specs }}
        run: make inject-chart-digests

      - name: Package and push charts
        run: make publish-charts
